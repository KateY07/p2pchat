<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The P2P Gazette</title>
<style>
  :root{color:#171717;background:#e9e5dc;font-family:Georgia,"Songti SC","SimSun",serif}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:900px;margin:auto;border-top:5px solid;border-bottom:3px solid}.masthead{padding:16px 0 12px;border-bottom:1px solid;text-align:center}.masthead small{letter-spacing:.2em}.masthead h1{font-size:clamp(34px,8vw,66px);line-height:.9;margin:7px 0;font-weight:900;letter-spacing:-.06em}.masthead p{margin:8px 0 0;font-size:14px}.summary{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid}.summary div{padding:11px;border-right:1px solid}.summary div:last-child{border:0}.summary b{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.summary span{display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.ok{color:#176334}.warn{color:#985b11}.bad{color:#a32525}.ledger{min-height:430px;padding:20px 2px;border-bottom:1px solid}.ledger h2{font-size:19px;margin:0 0 12px;border-bottom:2px solid;padding-bottom:5px}.ledger p{font:13px/1.55 ui-monospace,Consolas,monospace;margin:0;padding:3px 8px;overflow-wrap:anywhere}.ledger time{color:#777}.error{color:#9c2020}.event{color:#145f83}.chat{font-weight:bold}.entry{display:flex;gap:8px;padding:10px 0}.entry label{font:700 18px Georgia,serif}.entry input{flex:1;min-width:0;border:0;border-bottom:1px solid;background:transparent;padding:4px;font:16px Georgia,serif;outline:0}.entry button{border:1px solid;background:#171717;color:#f3f0e9;padding:5px 12px;font:700 12px Georgia,serif}.entry button:disabled{opacity:.45}@media(max-width:600px){body{padding:10px}.summary{grid-template-columns:1fr 1fr}.summary div:nth-child(2){border-right:0}.summary div:nth-child(-n+2){border-bottom:1px solid}.ledger{min-height:55vh}}
</style>
<main>
  <header class="masthead"><small>EST. WEBRTC · PUBLIC EDITION</small><h1>The P2P Gazette</h1><p>打开即自动加入公共大厅；聊天内容通过浏览器间 DataChannel 传输。</p></header>
  <section class="summary"><div><b>Identity</b><span id="name">—</span></div><div><b>Role</b><span id="role">starting</span></div><div><b>Channel</b><span id="channel">waiting</span></div><div><b>Route</b><span id="route">detecting</span></div></section>
  <article class="ledger"><h2>Connection Ledger</h2><div id="log"></div></article>
  <form id="form" class="entry"><label>&gt;</label><input id="text" disabled placeholder="connecting…"><button id="send" disabled>SEND</button></form>
</main>
<script>
  const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),room=(params.get('room')||'public-lobby-v1').replace(/[^a-z0-9-]/gi,'').slice(0,40),host='p2pchat-'+room,name=params.get('name')||'guest-'+Math.random().toString(36).slice(2,7),rtc={iceServers:params.get('hostOnly')==='1'?[]:[{urls:'stun:stun.l.google.com:19302'}]};
  let peer,conn,master=false,links=[],fallbackTimer,localRunning=false;
  const stat=(id,text,kind='')=>{const e=$(id);e.textContent=text;e.className=kind};
  function log(text,kind=''){const p=document.createElement('p');p.className=kind;p.textContent='['+new Date().toLocaleTimeString()+'] '+text;$('log').append(p);$('log').parentElement.scrollTop=1e9}
  function say(x,skip){links.forEach(c=>c!==skip&&c.open&&c.send(x))}
  async function route(c=conn){const pc=c?.peerConnection;if(!pc)return;const s=await pc.getStats(),pair=[...s.values()].find(x=>x.type==='candidate-pair'&&(x.selected||(x.nominated&&x.state==='succeeded')));if(!pair)return;const a=s.get(pair.localCandidateId),b=s.get(pair.remoteCandidateId),turn=a?.candidateType==='relay'||b?.candidateType==='relay';stat('route',(turn?'TURN relay':'P2P direct')+' · '+(a?.candidateType||'?')+'→'+(b?.candidateType||'?'),turn?'warn':'ok');log('route: '+$('route').textContent,turn?'event':'')}
  function bind(c){conn=c;links.push(c);log('data channel created → '+c.peer,'event');const pc=c.peerConnection;if(pc){pc.addEventListener('iceconnectionstatechange',()=>log('ICE: '+pc.iceConnectionState,'event'));pc.addEventListener('connectionstatechange',()=>log('RTC: '+pc.connectionState,'event'));pc.addEventListener('icecandidate',e=>e.candidate&&log('candidate: '+e.candidate.type+' / '+e.candidate.protocol,'event'));pc.addEventListener('icecandidateerror',e=>log('ICE server error '+e.errorCode+': '+e.errorText,'error'))}c.on('open',()=>{if(localRunning)return;clearTimeout(fallbackTimer);stat('channel','open','ok');$('text').disabled=$('send').disabled=false;$('text').placeholder='write a message';log('data channel open → '+c.peer,'event');route(c).catch(e=>log('stats: '+e.message,'error'));if(!master)c.send({t:'hello',n:name})});c.on('data',x=>{if(localRunning)return;if(x.t==='hello'&&master){log(x.n+' joined','event');say({t:'note',v:x.n+' joined'},c)}else if(x.t==='probe'&&master){log('selftest: probe received by host','event');c.send({t:'probe-reply',v:x.v})}else if(x.t==='chat'){log(x.n+': '+x.v,'chat');if(master)say(x,c)}else if(x.t==='note')log(x.v,'event')});c.on('close',()=>{if(localRunning)return;stat('channel','closed','warn');log('data channel closed','error')});c.on('error',e=>{if(localRunning)return;stat('channel','error','bad');log('data error: '+(e.message||e.type),'error')})}
  function selftest(){log('selftest: creating second PeerJS client','event');const testPeer=new Peer(undefined,{config:rtc});testPeer.on('open',id=>{log('selftest: second peer ready '+id,'event');const testConnection=testPeer.connect(host);const pc=testConnection.peerConnection;if(pc){pc.addEventListener('icecandidate',e=>e.candidate&&log('selftest candidate: '+e.candidate.type,'event'));pc.addEventListener('iceconnectionstatechange',()=>log('selftest ICE: '+pc.iceConnectionState,'event'));pc.addEventListener('connectionstatechange',()=>log('selftest RTC: '+pc.connectionState,'event'))}testConnection.on('open',()=>{log('selftest: channel open; sending probe','event');testConnection.send({t:'probe',v:'p2pchat-test'})});testConnection.on('data',x=>{if(x.t==='probe-reply'&&x.v==='p2pchat-test'){log('SELFTEST PASS: probe received and echoed over DataChannel','event');stat('route','selftest passed','ok')}});testConnection.on('error',e=>log('selftest data error: '+(e.message||e.type),'error'))});testPeer.on('error',e=>log('selftest signal error: '+(e.message||e.type),'error'))}
  function join(){peer=new Peer(undefined,{config:rtc});peer.on('open',id=>{stat('role','member','ok');log('signal open · member '+id,'event');bind(peer.connect(host,{reliable:true}))});peer.on('error',e=>log('signal error: '+(e.message||e.type),'error'))}
  function localFallback(){if(localRunning||$('channel').textContent==='open')return;localRunning=true;peer?.destroy();log('PeerJS path not open; switching to same-browser P2P','event');localBoot(true)}
  function boot(){stat('name',name);log('boot: finding lobby '+room);fallbackTimer=setTimeout(localFallback,8000);peer=new Peer(host,{config:rtc});peer.on('open',id=>{master=true;stat('role','host','ok');log('signal open · hosting lobby '+id,'event');peer.on('connection',bind);if(params.get('selftest')==='1')selftest()});peer.on('error',e=>{if(e.type==='unavailable-id'){log('lobby found; joining it','event');peer.destroy();join()}else{log('signal error: '+(e.message||e.type),'error');localFallback()}})}
  function localBoot(fallback=false){
    const id=Math.random().toString(36).slice(2),signal=new BroadcastChannel('p2pchat-local-'+room),pending=[];
    let pc,channel,other;
    stat('name',name);stat('role',fallback?'same browser':'localhost');log((fallback?'fallback':'local')+' mode: waiting for another tab in room '+room);
    const send=m=>signal.postMessage({...m,from:id,to:other});
    function attach(c){channel=c;c.onopen=()=>{stat('channel','open','ok');stat('route','P2P loopback','ok');$('text').disabled=$('send').disabled=false;$('text').placeholder='write a message';log('data channel open','event');clearInterval(announce)};c.onmessage=e=>{const x=JSON.parse(e.data);log(x.n+': '+x.v,'chat')};c.onclose=()=>{stat('channel','closed','warn');log('data channel closed','error')}}
    function connect(remote){if(pc)return;other=remote;pc=new RTCPeerConnection({iceServers:[]});window.__localPc=pc;pc.onicecandidate=e=>{if(e.candidate){const candidate=e.candidate.toJSON(),parts=candidate.candidate.split(' ');parts[4]='127.0.0.1';candidate.candidate=parts.join(' ');log('local candidate: host loopback','event');send({type:'candidate',candidate})}};pc.oniceconnectionstatechange=()=>log('ICE: '+pc.iceConnectionState,'event');pc.onconnectionstatechange=()=>log('RTC: '+pc.connectionState,'event');pc.ondatachannel=e=>attach(e.channel)}
    async function drain(){while(pending.length)await pc.addIceCandidate(pending.shift())}
    signal.onmessage=async e=>{const m=e.data;if(m.from===id||m.to&&m.to!==id)return;try{
      if(m.type==='hello'&&!pc&&id<m.from){connect(m.from);attach(pc.createDataChannel('chat'));await pc.setLocalDescription(await pc.createOffer());send({type:'offer',description:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}});log('offer sent','event')}
      if(m.type==='offer'){connect(m.from);await pc.setRemoteDescription(m.description);await drain();await pc.setLocalDescription(await pc.createAnswer());send({type:'answer',description:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}});log('answer sent','event')}
      if(m.type==='answer'&&pc){await pc.setRemoteDescription(m.description);await drain();log('answer received','event')}
      if(m.type==='candidate'){log('remote candidate received','event');if(pc?.remoteDescription)await pc.addIceCandidate(m.candidate);else pending.push(m.candidate)}
    }catch(error){log('signaling error: '+error.message,'error')}};
    const announce=setInterval(()=>{if(channel?.readyState!=='open')signal.postMessage({type:'hello',from:id})},1000);
    signal.postMessage({type:'hello',from:id});
    $('form').onsubmit=e=>{e.preventDefault();const v=$('text').value.trim();if(!v)return;if(channel?.readyState!=='open')return log('channel not open','error');channel.send(JSON.stringify({n:name,v}));log(name+': '+v,'chat');$('text').value=''};
  }
  async function rawtest(){stat('name','raw-webrtc-test');stat('role','local loopback');log('rawtest: creating two native RTCPeerConnections');const a=new RTCPeerConnection({iceServers:[]}),b=new RTCPeerConnection({iceServers:[]}),toA=[],toB=[];a.onicecandidate=e=>{if(e.candidate){log('rawtest A candidate: '+e.candidate.type+' '+(e.candidate.address?.endsWith('.local')?'mDNS':'IP'),'event');b.remoteDescription?b.addIceCandidate(e.candidate).catch(x=>log(x.message,'error')):toB.push(e.candidate)}};b.onicecandidate=e=>{if(e.candidate){log('rawtest B candidate: '+e.candidate.type+' '+(e.candidate.address?.endsWith('.local')?'mDNS':'IP'),'event');a.remoteDescription?a.addIceCandidate(e.candidate).catch(x=>log(x.message,'error')):toA.push(e.candidate)}};for(const [label,pc] of [['A',a],['B',b]]){pc.oniceconnectionstatechange=()=>log('rawtest '+label+' ICE: '+pc.iceConnectionState,'event');pc.onconnectionstatechange=()=>log('rawtest '+label+' RTC: '+pc.connectionState,'event');pc.onicegatheringstatechange=()=>log('rawtest '+label+' gathering: '+pc.iceGatheringState,'event')}b.ondatachannel=e=>e.channel.onmessage=m=>{log('rawtest B received: '+m.data,'event');e.channel.send('pong')};const channel=a.createDataChannel('probe');channel.onopen=()=>{log('rawtest A channel open; sending ping','event');channel.send('ping')};channel.onmessage=e=>{log('rawtest A received: '+e.data,'event');if(e.data==='pong'){stat('channel','open','ok');stat('route','native loopback PASS','ok');log('RAWTEST PASS: ping/pong over DataChannel','event')}};await a.setLocalDescription(await a.createOffer());await b.setRemoteDescription(a.localDescription);for(const c of toB)await b.addIceCandidate(c);await b.setLocalDescription(await b.createAnswer());await a.setRemoteDescription(b.localDescription);for(const c of toA)await a.addIceCandidate(c)}
  $('form').onsubmit=e=>{e.preventDefault();const v=$('text').value.trim();if(!v)return;const x={t:'chat',n:name,v};log(name+': '+v,'chat');master?say(x):conn?.open?conn.send(x):log('message dropped: channel closed','error');$('text').value=''};
  setInterval(()=>route().catch(e=>log('stats: '+e.message,'error')),5000);if(params.get('local')==='1')localBoot();else if(params.get('rawtest')==='1')rawtest().catch(e=>log('rawtest failed: '+e.message,'error'));else{const script=document.createElement('script');script.src='https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js';script.onload=boot;script.onerror=()=>log('PeerJS library failed to load','error');document.head.append(script)}
</script>
