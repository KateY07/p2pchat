<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2P Chatroom</title>
<style>
  :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8eef8;background:#101827}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:radial-gradient(circle at top,#1d3557,#101827 54%)}main{width:min(940px,100%);margin:auto}.hero{margin:12px 0 18px}h1{margin:0 0 7px;font-size:clamp(28px,5vw,42px)}p{margin:0;color:#a9bad0;line-height:1.5}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,.8fr);gap:16px}.panel{background:#182337eF;border:1px solid #31425f;border-radius:16px;box-shadow:0 16px 44px #0004}.chat{min-height:510px;display:flex;flex-direction:column;padding:18px}.messages{flex:1;overflow:auto;padding:4px}.message{margin:0 0 14px}.mine{text-align:right}.tag{font-size:12px;color:#98abc5;margin-bottom:4px}.bubble{display:inline-block;max-width:84%;padding:9px 12px;border-radius:11px;background:#293955;text-align:left;overflow-wrap:anywhere}.mine .bubble{background:#087da8}.note{text-align:center;color:#9aacc5;font-size:13px;margin:10px}.send{display:flex;gap:9px;margin-top:12px}input{min-width:0;flex:1;padding:11px 12px;border-radius:9px;border:1px solid #405574;background:#0d1523;color:inherit;outline:none}input:focus{border-color:#67d7ff}button{border:0;border-radius:9px;padding:11px 16px;background:#67d7ff;color:#092035;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.diagnostics{padding:20px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#34445e;color:#cad6e8}.ok{background:#07563e;color:#7ff2bf}.warn{background:#6a4210;color:#ffe09a}.bad{background:#6e2833;color:#ffc0c7}h2{font-size:16px;margin:20px 0 10px}.diagnostics h2:first-child{margin-top:0}.route{font-size:20px;font-weight:800;margin:10px 0 5px}.detail{font-size:13px;color:#9aacc5}.stats{margin:13px 0 0}.stats div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #2e3e58;font-size:13px}.stats dt{color:#9aacc5}.stats dd{margin:0;text-align:right;overflow-wrap:anywhere}.members{margin:0;padding-left:20px;color:#c9d6e8;font-size:14px}.members li{padding:3px 0}@media(max-width:720px){.grid{grid-template-columns:1fr}.chat{min-height:400px}}
</style>
<main>
  <header class="hero"><h1>公共 P2P Chatroom</h1><p>打开页面即自动进入公共大厅，昵称自动生成。信令使用 PeerJS Cloud，聊天数据通过 WebRTC DataChannel 传输。</p></header>
  <div class="grid">
    <section class="panel chat"><div id="messages" class="messages"></div><form id="form" class="send"><input id="text" maxlength="1000" placeholder="正在连接…" disabled><button id="send" disabled>发送</button></form></section>
    <aside class="panel diagnostics">
      <h2>连接诊断</h2><span id="signalBadge" class="badge">启动中</span><p id="signalText" class="detail" style="margin-top:9px">正在连接公共信令服务…</p>
      <div id="route" class="route">等待 DataChannel</div><p id="routeDetail" class="detail">建立连接后会显示 P2P 直连或 TURN 中继。</p>
      <dl class="stats"><div><dt>昵称</dt><dd id="name">—</dd></div><div><dt>角色</dt><dd id="role">—</dd></div><div><dt>Peer ID</dt><dd id="peerId">—</dd></div><div><dt>数据通道</dt><dd id="channel">等待中</dd></div><div><dt>ICE 候选</dt><dd id="candidate">—</dd></div></dl>
      <h2>在线人数</h2><ul id="members" class="members"><li>正在统计…</li></ul>
    </aside>
  </div>
</main>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const ROOM_HOST_ID = 'p2pchat-public-lobby-v1';
  const displayName = `访客-${Math.random().toString(36).slice(2, 6).toUpperCase()}`;
  let peer, hostConnection, isHost = false, activeConnection;
  const clients = new Map();

  $('name').textContent = displayName;
  const setSignal = (text, kind = '') => { $('signalBadge').textContent = kind === 'ok' ? '信令已连接' : kind === 'warn' ? '连接异常' : '连接中'; $('signalBadge').className = `badge ${kind}`; $('signalText').textContent = text; };
  const note = text => { const item = document.createElement('p'); item.className = 'note'; item.textContent = text; $('messages').append(item); $('messages').scrollTop = 1e9; };
  const show = (name, text, mine = false) => { const item = document.createElement('div'); item.className = `message${mine ? ' mine' : ''}`; item.innerHTML = '<div class="tag"></div><div class="bubble"></div>'; item.querySelector('.tag').textContent = name; item.querySelector('.bubble').textContent = text; $('messages').append(item); $('messages').scrollTop = 1e9; };
  const enableChat = () => { $('text').disabled = false; $('send').disabled = false; $('text').placeholder = '输入消息…'; };
  const setRole = role => { $('role').textContent = role; };
  const renderMembers = (count, names = []) => { $('members').replaceChildren(...(names.length ? names : Array.from({ length: count }, (_, i) => `在线用户 ${i + 1}`)).map(name => { const item = document.createElement('li'); item.textContent = name; return item; })); };
  const memberUpdate = () => { const names = [displayName, ...[...clients.values()].map(item => item.name)]; renderMembers(names.length, names); broadcast({ type:'members', names }); };
  function broadcast(message, except) { for (const client of clients.values()) if (client.connection !== except && client.connection.open) client.connection.send(message); }

  async function updateRoute(connection = activeConnection) {
    const pc = connection?.peerConnection;
    if (!pc?.getStats) return;
    const stats = await pc.getStats();
    let pair;
    for (const report of stats.values()) if (report.type === 'candidate-pair' && (report.selected || (report.nominated && report.state === 'succeeded'))) pair = report;
    if (!pair) return;
    const local = stats.get(pair.localCandidateId), remote = stats.get(pair.remoteCandidateId);
    const turn = local?.candidateType === 'relay' || remote?.candidateType === 'relay';
    $('route').textContent = turn ? 'TURN 中继' : 'P2P 直连';
    $('routeDetail').textContent = turn ? '当前网络无法直连，数据正通过 TURN 中继。' : '当前未检测到 TURN relay 候选。';
    $('candidate').textContent = `${local?.candidateType || '—'} → ${remote?.candidateType || '—'}`;
  }
  function bindConnection(connection) {
    activeConnection = connection;
    connection.on('open', () => { $('channel').textContent = '已建立'; enableChat(); updateRoute(connection).catch(() => {}); if (!isHost) note('已加入公共大厅。'); });
    connection.on('data', message => {
      if (message.type === 'hello' && isHost) { clients.set(connection.peer, { connection, name: message.name }); note(`${message.name} 加入大厅`); memberUpdate(); return; }
      if (message.type === 'chat') { show(message.name, message.text); if (isHost) broadcast(message, connection); }
      if (message.type === 'note') note(message.text);
      if (message.type === 'members') renderMembers(message.names.length, message.names);
    });
    connection.on('close', () => { $('channel').textContent = '已关闭'; if (isHost && clients.delete(connection.peer)) { note('一位用户离开大厅'); memberUpdate(); } });
    connection.on('error', error => { $('channel').textContent = `失败：${error.type || 'unknown'}`; $('route').textContent = '连接失败'; $('routeDetail').textContent = error.message || 'DataChannel 未能建立。'; });
  }
  function startClient() {
    peer = new Peer();
    peer.on('open', id => { $('peerId').textContent = id; setRole('大厅成员'); setSignal('已连接信令服务，正在加入公共大厅。', 'ok'); hostConnection = peer.connect(ROOM_HOST_ID, { reliable:true }); bindConnection(hostConnection); hostConnection.on('open', () => hostConnection.send({ type:'hello', name:displayName })); });
    peer.on('error', error => setSignal(`信令错误：${error.type || error.message}`, 'warn'));
  }
  function start() {
    note(`你好，${displayName}。正在自动进入公共大厅…`);
    peer = new Peer(ROOM_HOST_ID);
    peer.on('open', id => { isHost = true; $('peerId').textContent = id; setRole('大厅房主'); setSignal('已连接信令服务。你正在托管公共大厅。', 'ok'); renderMembers(1, [displayName]); note('公共大厅已创建，等待其他用户自动加入。'); peer.on('connection', bindConnection); });
    peer.on('error', error => { if (error.type === 'unavailable-id') { peer.destroy(); startClient(); } else setSignal(`信令错误：${error.type || error.message}`, 'warn'); });
  }
  $('form').onsubmit = event => { event.preventDefault(); const text = $('text').value.trim(); if (!text) return; const message = { type:'chat', name:displayName, text }; show(displayName, text, true); if (isHost) broadcast(message); else if (hostConnection?.open) hostConnection.send(message); $('text').value = ''; };
  setInterval(() => updateRoute().catch(() => {}), 3000);
  start();
</script>
