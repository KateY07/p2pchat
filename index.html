<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2P Chatroom</title>
<style>
  :root { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; color:#e8eef8; background:#101827; }
  * { box-sizing:border-box } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; }
  main { width:min(720px,100%); background:#182337; border:1px solid #2d3e59; border-radius:18px; overflow:hidden; box-shadow:0 18px 50px #0005; }
  header { padding:24px 28px 18px; border-bottom:1px solid #2d3e59; } h1 { margin:0 0 7px; font-size:26px; } p { color:#9fb0c9; margin:0; line-height:1.5; }
  .setup { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; padding:16px 28px; border-bottom:1px solid #2d3e59; }
  input { min-width:0; padding:11px 12px; color:inherit; background:#0d1523; border:1px solid #405574; border-radius:9px; outline:none; }
  input:focus { border-color:#67d7ff; } button { border:0; border-radius:9px; padding:11px 16px; background:#67d7ff; color:#092035; font-weight:700; cursor:pointer; } button:disabled { opacity:.5; cursor:not-allowed; }
  #status { padding:10px 28px; color:#9fb0c9; font-size:13px; border-bottom:1px solid #2d3e59; } #status.ok { color:#69e7ad; } #status.warn { color:#ffcc70; }
  #messages { height:320px; overflow:auto; padding:18px 28px; } .message { margin:0 0 14px; } .mine { text-align:right; } .tag { font-size:12px; color:#9fb0c9; margin-bottom:4px; } .bubble { display:inline-block; max-width:82%; text-align:left; overflow-wrap:anywhere; padding:9px 12px; border-radius:11px; background:#293955; } .mine .bubble { background:#056f98; } .note { text-align:center; color:#9fb0c9; font-size:13px; margin:9px; }
  form { display:flex; gap:10px; padding:16px 28px 24px; } form input { flex:1; }
  @media(max-width:560px){ .setup { grid-template-columns:1fr; } header,.setup,#status,#messages,form { padding-left:18px; padding-right:18px; } }
</style>
<main>
  <header><h1>浏览器 P2P Chatroom</h1><p>无需自建服务器。房间号用于匹配，聊天内容通过 WebRTC DataChannel 传输。</p></header>
  <section class="setup"><input id="name" maxlength="20" placeholder="昵称" value="访客"><input id="room" maxlength="40" placeholder="房间号" value="demo"><button id="join">进入</button></section>
  <div id="status">输入相同房间号后，第一位用户创建房间，其他用户会自动加入。</div>
  <div id="messages"></div>
  <form id="form"><input id="text" maxlength="1000" placeholder="连接后输入消息" disabled><button id="send" disabled>发送</button></form>
</main>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const status = (text, kind = '') => { $('status').textContent = text; $('status').className = kind; };
  const note = text => { const x = document.createElement('p'); x.className = 'note'; x.textContent = text; $('messages').append(x); $('messages').scrollTop = 1e9; };
  const show = (name, text, mine = false) => { const x = document.createElement('div'); x.className = `message${mine ? ' mine' : ''}`; x.innerHTML = '<div class="tag"></div><div class="bubble"></div>'; x.querySelector('.tag').textContent = name; x.querySelector('.bubble').textContent = text; $('messages').append(x); $('messages').scrollTop = 1e9; };
  const roomId = room => `p2pchat-${[...room].reduce((n, c) => ((n * 31) + c.charCodeAt(0)) >>> 0, 7)}`;
  let peer, hostConnection, isHost = false;
  const clients = new Map();

  function enableChat() { $('text').disabled = false; $('send').disabled = false; }
  function broadcast(message, except) { for (const connection of clients.values()) if (connection !== except && connection.open) connection.send(message); }
  function bindConnection(connection) {
    connection.on('open', () => { enableChat(); if (!isHost) status('已建立 P2P 连接；聊天数据直连到房主浏览器。', 'ok'); });
    connection.on('data', message => {
      if (message.type === 'hello' && isHost) { clients.set(connection.peer, connection); note(`${message.name} 加入房间`); broadcast({ type:'note', text:`${message.name} 加入房间` }, connection); return; }
      if (message.type === 'chat') { show(message.name, message.text); if (isHost) broadcast(message, connection); }
      if (message.type === 'note') note(message.text);
    });
    connection.on('close', () => { if (isHost && clients.delete(connection.peer)) { note('一位用户离开了房间'); broadcast({ type:'note', text:'一位用户离开了房间' }); } });
    connection.on('error', error => status(`连接错误：${error.type || error.message}`, 'warn'));
  }
  function startClient(hostId) {
    peer = new Peer();
    peer.on('open', () => { hostConnection = peer.connect(hostId, { reliable:true }); bindConnection(hostConnection); hostConnection.on('open', () => hostConnection.send({ type:'hello', name:$('name').value.trim() || '访客' })); });
    peer.on('error', error => status(`无法加入房间：${error.type || error.message}`, 'warn'));
  }
  $('join').onclick = () => {
    const room = $('room').value.trim(); if (!room) return status('请输入房间号。', 'warn');
    $('join').disabled = true; $('name').disabled = true; $('room').disabled = true;
    const hostId = roomId(room);
    peer = new Peer(hostId);
    peer.on('open', () => { isHost = true; enableChat(); status('你是房主，正在等待其他用户加入。', 'ok'); note('房间已创建。把相同房间号发给朋友即可。'); peer.on('connection', bindConnection); });
    peer.on('error', error => { if (error.type === 'unavailable-id') { peer.destroy(); startClient(hostId); } else status(`信令连接错误：${error.type || error.message}`, 'warn'); });
  };
  $('form').onsubmit = event => {
    event.preventDefault(); const text = $('text').value.trim(); if (!text) return;
    const message = { type:'chat', name:$('name').value.trim() || '访客', text };
    show(message.name, text, true); if (isHost) broadcast(message); else if (hostConnection?.open) hostConnection.send(message);
    $('text').value = '';
  };
</script>
